services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/activation
      DB_USERNAME: activation
      DB_PASSWORD: activation
      PROVIDER_BASE_URL: http://provider:8080
      # O app busca as chaves pela rede interna; o emissor é o endereço usado pelo host para pedir o token.
      JWT_JWK_SET_URI: http://auth:8080/default/jwks
      JWT_ISSUER: http://localhost:8090/default
      JWT_AUDIENCE: activation-service
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      postgres:
        condition: service_healthy
      provider:
        condition: service_started
      auth:
        condition: service_started
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Provedor externo simulado. O comportamento depende do productCode (ver docker/provider-mock).
  provider:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8089:8080"
    volumes:
      - ./docker/provider-mock:/home/wiremock:ro
    command: ["--global-response-templating", "--disable-banner"]

  # Servidor OAuth 2.0 de testes: emite tokens client_credentials com o escopo pedido.
  auth:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.7
    ports:
      - "8090:8080"
    environment:
      JSON_CONFIG: >-
        {"tokenCallbacks": [{"issuerId": "default", "tokenExpiry": 3600, "requestMappings": [
          {"requestParam": "scope", "match": "*",
           "claims": {"sub": "$${clientId}", "aud": ["activation-service"], "scope": "$${scope}"}}]}]}
