spring:
  application:
    name: activation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:activation}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWKS do servidor de autorização; as chaves são buscadas sob demanda e ficam em cache.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/default/jwks}
          issuer-uri: ${JWT_ISSUER:http://localhost:8090/default}
          audiences: ${JWT_AUDIENCE:activation-service}

server:
  shutdown: graceful

activation:
  provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
  processing:
    batch-size: 20
    max-attempts: ${PROCESSING_MAX_ATTEMPTS:5}
    initial-backoff: 2s
    max-backoff: 5m
    stuck-timeout: 2m

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        activation.provider.requests: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  include-application-name: false
