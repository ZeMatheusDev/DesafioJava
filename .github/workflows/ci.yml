name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testes unitários e de integração (Testcontainers usa o Docker do runner).
      - name: Build e testes
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Imagem Docker
        run: docker build -t activation-service:${{ github.sha }} .
